name: Build with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      # The end to end tests start PostgreSQL with Testcontainers (Docker is available on
      # ubuntu-latest) and use SQLite files. The maven plugin is tested with the invoker.
      - name: Build, test and measure coverage
        run: ./mvnw $MAVEN_CLI_OPTS clean verify -Dcodecover
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/it/*/build.log
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('flylite-coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml') != ''
        with:
          name: coverage-report
          path: flylite-coverage-aggregate/target/site/jacoco-aggregate
