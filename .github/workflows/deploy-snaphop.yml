name: Deploy to SnapHop

# Releases: bin/release.sh pushes a vX.Y.Z tag which deploys that release.
# Snapshots: run this workflow manually on a branch to deploy its X.Y.Z-SNAPSHOT.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MAVEN_CLI_OPTS: "-s .snaphop/settings.xml --batch-mode --no-transfer-progress"
      NEXUS_SNAPHOP_COM_PASSWORD: ${{ secrets.NEXUS_SNAPHOP_COM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Check version
        id: version
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout -N)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
            echo "profiles=-Prelease" >> "$GITHUB_OUTPUT"
          elif [[ "$version" != *-SNAPSHOT ]]; then
            echo "Release versions are only deployed from vX.Y.Z tags" >&2
            exit 1
          fi
      # Runs all tests (Docker is available for Testcontainers) before deploying.
      - name: Deploy ${{ steps.version.outputs.version }}
        run: ./mvnw $MAVEN_CLI_OPTS ${{ steps.version.outputs.profiles }} clean deploy
